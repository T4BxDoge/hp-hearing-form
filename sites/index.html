<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>制作サイト一覧</title>
<style>
:root{--bg:#f4f5f4;--fg:#1d2423;--muted:#647170;--line:#d8dedd;--accent:#1f6f66;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--bg:#141817;--fg:#e6eceb;--muted:#9aa9a7;--line:#2c3533;--accent:#5cc0b2;color-scheme:dark}}
body{margin:0;background:var(--bg);color:var(--fg);font-family:"Hiragino Sans","Noto Sans JP",sans-serif;line-height:1.7}
main{max-width:640px;margin:0 auto;padding:48px 20px}
h1{font-size:1.4rem;margin:0 0 24px}
ul{list-style:none;margin:0;padding:0;border-top:1px solid var(--line)}
li{border-bottom:1px solid var(--line)}
a{display:flex;justify-content:space-between;gap:16px;padding:16px 4px;color:inherit;text-decoration:none}
a:hover b{color:var(--accent)}
span{color:var(--muted);font-size:.85rem;white-space:nowrap}
</style>
</head>
<body>
<main>
<h1>制作サイト一覧</h1>

</ul>
</main>
</body>
</html>
